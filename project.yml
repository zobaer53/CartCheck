name: CartCheck
options:
  bundleIdPrefix: com.zobaerhossain
  deploymentTarget:
    iOS: "26.0"

packages:
  CartCheckKit:
    path: CartCheckKit

targets:
  CartCheck:
    type: application
    platform: iOS
    sources:
      - CartCheck/Sources
    dependencies:
      - package: CartCheckKit
        product: CartCheckDomain
      - package: CartCheckKit
        product: CartCheckData
      - target: CartCheckWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zobaerhossain.CartCheck
        DEVELOPMENT_TEAM: AF97PVM7U3
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        # iPhone only, no iPad — 1 = iPhone, 2 = iPad, "1,2" = universal.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        # NSCameraUsageDescription/NSSupportsLiveActivities go through a
        # real Info.plist file (merged with the auto-generated keys below)
        # rather than an INFOPLIST_KEY_* build setting. Lesson from
        # OneThingToday: Xcode's INFOPLIST_KEY_* -> Info.plist synthesis
        # can silently drop a key it doesn't recognize, with no build
        # error — confirmed by inspecting a real built Info.plist, not
        # assumption. Cheaper to rule this whole failure mode out from day
        # one than debug it later.
        INFOPLIST_FILE: CartCheck/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  CartCheckWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - CartCheckWidget/Sources
      - path: CartCheck/Sources/LiveActivity/CartCheckActivityAttributes.swift
      - path: CartCheck/Sources/Shared/Decimal+Currency.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zobaerhossain.CartCheck.Widget
        DEVELOPMENT_TEAM: AF97PVM7U3
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: CartCheckWidget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "CartCheck"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: "YES"
